[project]
name = "volo-vhdl"
version = "0.1.0"
description = "VHDL-2008 project for FPGA development targeting Moku devices with AI-powered workflow"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Volo VHDL Team" }
]

dependencies = [
    # Testing Framework
    "cocotb>=1.8.0",

    # Data Validation (Bench Framework)
    "pydantic>=2.0.0",

    # Hardware Backend (MCC API) - Phase 3
    "moku>=3.0.0",

    # Build Tools (MCC Package Builder)
    "pyyaml>=6.0.0",

    # Data Analysis (Hardware Validation)
    "numpy>=1.24.0",

    # CLI Tools (moku-go deployment utility)
    "typer>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "zeroconf>=0.147.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

# Note: Script entrypoints are defined but not installed
# (project is not packaged to avoid setuptools conflicts with VHDL tree)
# Use: uv run python tools/moku_go.py
[project.scripts]
moku-go = "tools.moku_go:main"

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

# Note: This project is primarily VHDL with Python test infrastructure
# Not intended to be built as a Python package, just dependency management
