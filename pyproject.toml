[project]
name = "volo-vhdl"
version = "0.1.0"
description = "VHDL-2008 project for FPGA development targeting Moku devices with AI-powered workflow"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Volo VHDL Team" }
]

dependencies = [
    # Testing Framework
    "cocotb>=1.8.0",

    # Data Validation (Bench Framework)
    "pydantic>=2.0.0",

    # Hardware Backend (MCC API) - Phase 3
    "moku>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

# Note: This project is primarily VHDL with Python test infrastructure
# Not intended to be built as a Python package, just dependency management
