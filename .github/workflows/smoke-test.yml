name: Smoke Test

# Runs on every push for quick feedback
on:
  push:
    branches: [ '**' ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install GHDL
      run: |
        sudo apt-get update
        sudo apt-get install -y ghdl

    - name: Smoke test - Build VHDL dependencies
      run: |
        echo "Quick smoke test: Building VHDL dependency graph..."
        uv run python scripts/build_vhdl_deps.py
        echo "✅ Smoke test passed - all modules analyzed!"
